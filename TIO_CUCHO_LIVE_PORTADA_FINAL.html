.actions{display:grid;grid-template-columns:1fr;gap:9px;margin-top:-4px}
button{width:100%;min-height:58px;border-radius:14px;font-size:16px;font-weight:900;cursor:pointer;letter-spacing:.2px;padding:10px}
.create{background:linear-gradient(#21170a,#050505);border:2px solid #d9ac42;color:#f8d56c}.whatsapp{background:linear-gradient(#28c65a,#087c32);border:2px solid #a0f0aa;color:#fff}
.join{background:linear-gradient(#17130c,#050505);border:2px solid #a9873d;border-radius:14px;padding:9px}.join label{display:block;text-align:center;font-weight:900;color:#f6e6b7;margin-bottom:7px}
.joinrow{display:flex;gap:7px}input{width:100%;min-width:0;border-radius:9px;padding:12px;background:#090807;border:1px solid #9e7a39;color:white;font-size:16px}#go{width:54px;flex-shrink:0;background:#b21e13;border:1px solid #ff8c70;color:#fff;font-size:22px}
#status{display:none;margin:10px 0;padding:12px;background:#100d09;border:1px solid #b58b37;border-radius:10px;color:#f8e7b9;text-align:center;overflow-wrap:anywhere}
#roompanel{display:none;margin-top:10px;padding:14px;background:#100d09;border:1px solid #c49a3c;border-radius:12px}#roompanel h2{margin:0 0 8px;color:#f2ca5d}#roompanel p{font-size:14px;line-height:1.4}.row{display:flex;gap:8px}.row button{min-height:44px;font-size:13px}
@media(min-width:650px){.hero{height:58vh;max-height:640px}.actions{grid-template-columns:1fr 1.15fr 1fr;align-items:stretch}.create,.whatsapp{min-height:86px}.join{min-height:86px}.join label{font-size:14px}.joinrow input{font-size:14px}}
</style></head><body><main class="app"><div class="hero" role="img" aria-label="Portada Tío Cucho Live con bandera paraguaya y cartas españolas"></div>
<div class="actions"><button class="create" id="create">📹 CREAR SALA<br><small>Como anfitrión</small></button>
<div class="join"><label for="code">👥 INGRESAR POR CÓDIGO</label><div class="joinrow"><input id="code" maxlength="8" placeholder="Código de sala" aria-label="Código de sala"><button id="go" aria-label="Ingresar">➜</button></div></div>
<button class="whatsapp" id="share">🟢 COMPARTIR<br><small>Por WhatsApp</small></button></div>
<div id="status" role="status"></div><section id="roompanel"><h2>Invitación de sala</h2><p>Código: <strong id="roomcode" style="color:#f4ce60;letter-spacing:3px"></strong></p><p>La portada y los controles están listos. Las salas reales y el video en vivo todavía necesitan conexión al servidor LiveKit.</p><div class="row"><button class="create" id="copy">Copiar invitación</button><button class="whatsapp" id="shareRoom">WhatsApp</button></div></section>
<script>
const $=id=>document.getElementById(id);let room='';
function makeCode(){return Math.random().toString(36).slice(2,8).toUpperCase()}
function show(t){$('status').style.display='block';$('status').textContent=t}
$('create').onclick=()=>{room=makeCode();$('roomcode').textContent=room;$('roompanel').style.display='block';show('Sala de demostración creada. Código: '+room)}
$('go').onclick=()=>{let c=$('code').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');if(c.length<4){show('Ingresá el código de invitación.');return}room=c;show('Código ingresado: '+c+'. La conexión a una sala real todavía debe integrarse.')}
function invite(){return '👑 TÍO CUCHO LIVE\nCódigo de invitación: '+(room||'Creá una sala primero')+'\n'+location.href}
$('share').onclick=()=>location.href='https://wa.me/?text='+encodeURIComponent(invite())
$('shareRoom').onclick=()=>location.href='https://wa.me/?text='+encodeURIComponent(invite())
$('copy').onclick=async()=>{let t=invite();try{await navigator.clipboard.writeText(t);show('Invitación copiada.')}catch(e){show(t)}}
</script></main></body></html>
